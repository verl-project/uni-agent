# Simulated sandbox observation templates.
#
# Structure: route_key -> list of {weight, text}. Sampling is weighted.
#
# Purpose: exercise the e2e pipeline (router dispatch, KV/prefix traffic,
# trajectory write-out) with structurally correct but generic tool output.
# Texts keep the SHAPE of each tool's real output (pytest banner, traceback,
# file listing) so parsing and token volume behave realistically, but carry
# no project-specific names — replaceable placeholders only (module_a,
# tests/test_case_*.py).
#
# Weight notes:
# - test_output is weighted toward success (~8:2) so agent loops reach
#   `submit` instead of spinning to max_turns — keeps e2e wall time bounded.
# - A few diverse entries per key avoid identical token blocks across
#   sessions (prefix-cache hit rate stays meaningful without being pinned).
# - observation_scale multiplies every entry's length globally.

# ---------------------------------------------------------------------------
# pytest runs — mostly passing so loops reach submit.
# ---------------------------------------------------------------------------

# OpenClaw Combine deltas over openclaw_base.
hydra:
  searchpath:
    - pkg://verl.trainer.config
    - pkg://uni_agent.openclaw.config

defaults:
  - openclaw_base
  - distillation/distillation@distillation
  - _self_

distillation:
  enabled: True
  n_gpus_per_node: 1
  nnodes: 1
  distillation_loss:
    loss_mode: openclaw_combine
    use_policy_gradient: False
    use_task_rewards: False
    distillation_loss_coef: 1.0
    policy_loss_mode: vanilla
    clip_ratio: 0.2
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
  # Placeholder teacher entry required by DistillationConfig.
  teacher_models:
    teacher_model:
      model_path: ${actor_rollout_ref.model.path}
      inference:
        tensor_model_parallel_size: 1
        data_parallel_size: 1
        pipeline_model_parallel_size: 1

actor_rollout_ref:
  actor:
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28


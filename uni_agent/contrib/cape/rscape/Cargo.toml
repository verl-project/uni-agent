[package]
name = "rscape"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "Rust command-line implementation of the CAPE wire protocol"
license = "Apache-2.0"

[[bin]]
name = "rscape"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.75"
axum = "=0.6.20"
chrono = { version = "=0.4.31", default-features = false, features = ["clock"] }
clap = { version = "=4.4.18", features = ["derive", "env"] }
nix = { version = "=0.27.1", features = ["process", "signal", "fs"] }
reqwest = { version = "=0.11.23", default-features = false, features = ["json", "rustls-tls"] }
ring = "=0.17.14"
rusqlite = { version = "=0.30.0", features = ["bundled"] }
serde = { version = "=1.0.220", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
thiserror = "=1.0.50"
tokio = { version = "=1.35.1", features = ["macros", "rt-multi-thread", "signal", "time", "process", "sync", "io-util"] }
uuid = { version = "=1.6.1", features = ["v4"] }
url = "=2.4.1"
indexmap = "=2.1.0"

[dev-dependencies]
tempfile = "=3.8.1"

# OpenClaw inference-only task defaults for the current-framework SWE-bench samples.
# Timeout values are seconds; provider defaults supply resources not listed here.
# The sample row supplies the instance metadata and sandbox image; this file
# selects the generic SWEBenchTask and binds the OpenClaw agent. The user prompt
# remains required at runtime: task_runner copies the dataset raw_prompt into
# TaskConfig.prompt, and OpenClawAgent extracts it before --message-file launch.
- name: swe_bench
  sandbox:
    provider: openyuanrong
    runtime_timeout: 7200
    image_map:
      - from: "swebench/**"
        to: "swr.cn-east-3.myhuaweicloud.com/openyuanrong/swe-bench-verified/**:v2"
    sandbox_kwargs:
      proxy_port: 38197
      mounts:
        - target: /opt/openclaw
          image_url: swr.cn-east-3.myhuaweicloud.com/openyuanrong/openclaw-tool@sha256:90cef4641f82a955692385c48cb4db01a3bd73fc6f68f37962a58717ce547c13
  agent:
    name: openclaw
  prompt_template:
    - role: system
      content: |-
        Fix the issue with the smallest correct source change in the task repository.
        Before editing, inspect the relevant implementation and its existing tests.
        Run focused existing tests only when their dependencies are already present;
        otherwise skip them and report the limitation. Base the fix on observed
        behavior and keep unrelated code unchanged. Never install packages or modify
        dependencies, tests, or unrelated modules; do not create stubs or mocks to
        bypass missing dependencies, and do not commit or push changes.
    - role: user
      content: "{problem_statement}"

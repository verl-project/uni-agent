- name: swe_bench
  sandbox:
    provider: modal
    runtime_timeout: 7200
  agent:
    name: claude_code
    max_turns: 200
    run_timeout: 4800
    verbose: true
    model:
      temperature: 1.0
      top_p: 0.95
      max_total_tokens: 131072
  prompt_template:
    - role: system
      content: You are a software engineer working in an existing repository.
    - role: user
      content: |-
        <uploaded_files>
        /testbed
        </uploaded_files>
        Inspect the repository in /testbed and resolve the following issue:

        <issue_description>
        {problem_statement}
        </issue_description>

        Understand the relevant code and expected behavior before editing. Implement the smallest correct change in non-test files, preserve existing behavior outside the issue, and follow the repository's established patterns. Do not modify existing tests. Validate the change with focused reproduction steps and the relevant test suite before finishing.


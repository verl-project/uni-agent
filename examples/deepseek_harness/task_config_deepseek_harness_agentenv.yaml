# Select with TASK_CONFIG when running run_train.sh.
# Configure AGENTENV_API_URL, AGENTENV_SANDBOX_URL, and AGENTENV_API_KEY on
# the rollout workers. The AgentEnv deployment must be able to pull both
# the sample's mapped task image and the DSH tool image.
- name: swe_rebench
  sandbox:
    provider: agentenv
    runtime_timeout: 7200
    image_map:
      - from: "swebench/**"
        to: "swr.cn-east-3.myhuaweicloud.com/openyuanrong/swebench/**"
      - from: "swerebench/**"
        to: "swr.cn-east-3.myhuaweicloud.com/openyuanrong/swerebench/**"
    image_mounts:
      - image: swr.cn-east-3.myhuaweicloud.com/openyuanrong/dsh-tool:latest
        mount_path: /opt/dsh
    executable_paths:
      dsh: /opt/dsh/bin/dsh
      node: /opt/dsh/bin/node
    # Enable these settings when the guest needs the SSH relay for Gateway.
    # sandbox_kwargs:
    #   proxy_port: 38197
    #   tunnel_ssh_host: gateway-relay
  agent:
    name: deepseek_harness
    run_timeout: 7200
    conda_env_path: /opt/miniconda3/envs/testbed
    tool_mode: minimal
    step_limit: 100


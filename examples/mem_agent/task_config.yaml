- name: hotpotqa
  sandbox:
    provider: local
  agent:
    name: mem_agent
    max_memorization_length: 1024
    max_chunks: 8
    max_final_response_length: 1024
    max_steps: 9
    # Defaults for direct API inference (examples/mem_agent/infer.py).
    model:
      temperature: 1.0
      top_k: -1
  # Session defaults for training through the gateway; omit top_p to inherit rollout.

name: Python Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: "verl-ci-cn-beijing.cr.volces.com/verlai/verl:vllm018.dev1"
  DYNAMIC_RUNNER_ENDPOINT: "https://sh6mtrbg8demerkmc1uhk.apigateway-cn-beijing.volceapi.com/runner/create/runner"

jobs:
  setup:
#    if: >-
#      github.repository_owner == 'verl-project' && (
#        github.event_name != 'pull_request' ||
#        contains(github.event.pull_request.labels.*.name, 'ready-for-ci')
#      )
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-runner.outputs.runner-label }}
      mlp-task-id: ${{ steps.create-runner.outputs.mlp-task-id }}
    steps:
#      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: create-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "create"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-image: "${{ env.IMAGE }}"

  test-and-build:
    needs: setup
    runs-on: ["${{ needs.setup.outputs.runner-label || 'L20x8' }}"]
    timeout-minutes: 60

    # tested in multi python version
    strategy:
      matrix:
        python-version: [ "3.12" ]

#    env:
#      HTTPS_PROXY: ${{ secrets.PROXY_HTTPS }}
#      NO_PROXY: "localhost,127.0.0.1,hf-mirror.com"
#      HF_ENDPOINT: "https://hf-mirror.com"
#      HF_HUB_ENABLE_HF_TRANSFER: "0"

    steps:
      # 1. git clone code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      # 2. set up python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # 3. install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt -i https://pypi.org/simple
          
          git clone --branch v4.1.0 https://github.com/princeton-nlp/SWE-bench.git
          cd SWE-bench
          pip install -e .

      # 4. Test with pytest
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov pytest-custom_exit_code
          export PYTHONPATH="${PYTHONPATH}:${GITHUB_WORKSPACE}"
          pytest tests/uni_agent/ -m="gpu and level0" --suppress-no-test-exit-code --cov=./uni_agent/ --cov-report=xml --cov-report=term

      # 5. Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

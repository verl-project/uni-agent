name: OpenCode 1.x integration
on:
  push:
    branches: [codex/opencode-1x-integration, codex/opencode-review-followup]
  workflow_dispatch:
  pull_request:
    branches: [feat/opencode-recipe]
    paths:
      - "uni_agent/agents/opencode/**"
      - "uni_agent/sandbox/**"
      - "tests/uni_agent/agents/**"
      - "tests/uni_agent/sandbox/**"
      - "examples/opencode/**"
      - "examples/sidecar/opencode/**"
      - "scripts/validation/**"
      - ".github/workflows/opencode-integration.yml"
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  saturation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r scripts/validation/opencode-phase1-requirements.txt
      - name: Saturated default executor and explicit lifecycle drain
        run: |
          mkdir -p results
          PYTHONPATH=. python scripts/validation/executor_saturation.py --require-clean-shutdown --output results/saturation.json | tee results/saturation.log
      - name: Existing provider regression suite
        run: PYTHONPATH=. python -m pytest tests/uni_agent/sandbox/test_local_sandbox.py tests/uni_agent/sandbox/test_local_descendant_groups.py -q --tb=short --junitxml=results/provider.xml | tee results/provider.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saturation-python-${{ matrix.python }}
          path: results/
  sidecar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ['1.18.18', '1.19.3']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/validation/opencode-phase1-requirements.txt
      - name: Build representative release sidecar
        env:
          CLI_VERSION: '${{ matrix.version }}'
        run: |
          mkdir -p results
          if [ "$CLI_VERSION" = 1.19.3 ]; then
            checksum=11d46c02fd50140d73da20bc66628a75322d6a57dbe5eb37cd124958dcb11d687f0be2b0038b29780dff42adab3de2b3c78c5f8ddaac519ab40617018ffec3c6
          else
            checksum=7170f580067e4d399d137b675b2e6a3ecb598eb9db3e0d2b3d4c2d70778b69e07e298c50584a227b573cf2862665f43e45623afbff8b2c5d05536f54c9dd4daf
          fi
          args=(--build-arg "OPENCODE_VERSION=$CLI_VERSION" --build-arg "OPENCODE_SHA512=$checksum")
          docker build --progress=plain "${args[@]}" -t ua-opencode-integration examples/sidecar/opencode 2>&1 | tee results/build.log
          docker image inspect ua-opencode-integration > results/image.json
          cid=$(docker create ua-opencode-integration /bin/true)
          mkdir -p "$RUNNER_TEMP/payload"
          docker export "$cid" | tar -x -C "$RUNNER_TEMP/payload"
          docker rm "$cid"
          sudo mkdir -p /opt/opencode
          sudo mount --bind "$RUNNER_TEMP/payload" /opt/opencode
          sudo mount -o remount,bind,ro /opt/opencode
          mount | grep /opt/opencode > results/mount.txt
          /opt/opencode/bin/probe.sh | tee results/startup.log
      - name: Record exact CLI and configuration contract
        env:
          CLI_VERSION: '${{ matrix.version }}'
        run: PYTHONPATH=. python scripts/validation/inspect_opencode_contract.py --cli /opt/opencode/bin/opencode --expected "$CLI_VERSION" --output results/contract.json
      - name: Production adapter and provider integration
        env:
          OPENCODE_BIN: /opt/opencode/bin/opencode
          OPENCODE_SIDECAR_BIN: /opt/opencode/bin/opencode
          OPENCODE_VERSION: '${{ matrix.version }}'
        run: |
          bash scripts/validation/run_opencode_integration.sh results/combined
          PYTHONPATH=. python -m pytest tests/uni_agent/agents/test_opencode_sidecar_environment.py \
            -q -s --tb=short --junitxml=results/environment.xml | tee results/environment.log
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('results/environment.xml').getroot().iter('testsuite'))
          assert sum(int(s.attrib['tests']) for s in suites) == 4
          assert all(int(s.attrib[k]) == 0 for s in suites for k in ['failures','errors','skipped'])
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidecar-${{ matrix.version }}
          path: results/

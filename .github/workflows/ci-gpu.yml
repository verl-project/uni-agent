name: tests-gpu

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: "verl-ci-cn-beijing.cr.volces.com/verlai/verl:uv.cu130.dev5"
  DYNAMIC_RUNNER_ENDPOINT: "https://sh6mtrbg8demerkmc1uhk.apigateway-cn-beijing.volceapi.com/runner/create/runner"

jobs:
  #  detect changes file
  changes:
    uses: ./.github/workflows/detect-changes.yml

  # ============ Job: test in gpu ============
  setup:
    needs: changes
    if: needs.changes.outputs.gpu == 'true'
    runs-on: ubuntu-latest
    outputs:
      runner-label: ${{ steps.create-runner.outputs.runner-label }}
      mlp-task-id: ${{ steps.create-runner.outputs.mlp-task-id }}
    steps:
      - id: create-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "create"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-image: "${{ env.IMAGE }}"

  run:
    needs: setup
    runs-on: [ "${{ needs.setup.outputs.runner-label || 'L20x8' }}" ]
    timeout-minutes: 60

    # tested in certain python version
    strategy:
      matrix:
        python-version: [ "3.12" ]

    env:
      # Same public egress proxy used by verl's UV GPU runners. Cache misses
      # must also work for fork PRs, where repository secrets are unavailable.
      HTTP_PROXY: "http://100.68.174.87:3128"
      HTTPS_PROXY: "http://100.68.174.87:3128"
      NO_PROXY: "localhost,127.0.0.1"
      UV_PYTHON: "3.12"
      UV_RUN: "uv run --locked --all-packages --extra vllm --extra megatron --extra swebench"

    steps:
      # 1. git clone code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      # Use the image's UV cache; all Python packages come from the root lock.
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure UV cache
        run: |
          echo "UV_CACHE_DIR=${HOME}/.cache/uv" >> "${GITHUB_ENV}"
          uv --version

      - name: Sync locked GPU environment
        run: |
          uv sync --locked --all-packages --extra vllm --extra megatron --extra swebench
          $UV_RUN python scripts/refresh_uv.py --check

      - name: Test GPU environment and Ray workers
        run: |
          export PYTHONPATH="${PYTHONPATH}:${GITHUB_WORKSPACE}"
          $UV_RUN pytest -v -rA -s tests/uni_agent/ -m="gpu and level0" --cov=./uni_agent/ --cov-report=xml --cov-report=term

      - name: Prepare original GPU router E2E assets
        env:
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_OFFLINE: "0"
          HF_HUB_DISABLE_XET: "1"
        run: |
          $UV_RUN python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download
          from uni_agent.tasks.swe_bench.preprocess import build_swe_bench_verified

          model = snapshot_download(
              "Qwen/Qwen3-4B-Instruct-2507",
              allow_patterns=["*.json", "*.safetensors", "*.txt", "*.jinja"],
          )
          output = Path(os.environ["RUNNER_TEMP"]) / "uni-agent-router-e2e.parquet"
          build_swe_bench_verified(max_instances=4).to_parquet(output)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"VLLM_MODEL={model}\nSWEBENCH_DATASET={output}\n")
          print(f"Router E2E model snapshot: {model}")
          print(f"Router E2E dataset: {output}")
          PY

      - name: Test original GPU router E2E
        env:
          RAY_enable_open_telemetry: "0"
        run: |
          export PYTHONPATH="${PYTHONPATH}:${GITHUB_WORKSPACE}"
          export NO_PROXY="${NO_PROXY},$($UV_RUN python -c 'from ray.util import get_node_ip_address; print(get_node_ip_address())')"
          export no_proxy="${NO_PROXY}"
          $UV_RUN pytest -v -rA -s tests/uni_agent/agent_aware_router/e2e/test_router_e2e.py -m="gpu and level1" --cov=./uni_agent/ --cov-append --cov-report=xml --cov-report=term

      - name: Upload GPU coverage
        uses: codecov/codecov-action@v4
        # Coverage is best-effort, including action/network failures that can
        # escape Codecov's fail_ci_if_error handling. GPU tests remain required.
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: gpu-tests
          fail_ci_if_error: false

  gpu-gate:
    runs-on: ubuntu-latest
    needs: [ changes, setup, run ]
    if: always()
    steps:
      - name: Report result
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "GPU change detection failed"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.gpu }}" != "true" ]]; then
            echo "GPU CI not required for these changes"
            exit 0
          fi
          if [[ "${{ needs.setup.result }}" != "success" || "${{ needs.run.result }}" != "success" ]]; then
            echo "GPU CI FAILED"
            exit 1
          fi
          echo "GPU CI SUCCESS"

  cleanup:
    runs-on: ubuntu-latest
    needs: [ setup, run, gpu-gate ]
    if: always() && needs.setup.outputs.mlp-task-id != ''
    steps:
      - id: destroy-runner
        uses: volcengine/vemlp-github-runner@v1
        with:
          mode: "destroy"
          faas-url: "${{ env.DYNAMIC_RUNNER_ENDPOINT }}"
          mlp-task-id: "${{ needs.setup.outputs.mlp-task-id }}"

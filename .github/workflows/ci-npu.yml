name: tests-npu
on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]
jobs:
  test-npu:
    runs-on: linux-aarch64-a2-8
    container:
      image: ascendai/cann:latest

    strategy:
      matrix:
        python-version: [ "3.12" ]

    env:
      # use GitHub proxy to download
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # set pypi source
      UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi https://pypi.tuna.tsinghua.edu.cn/simple"
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_NO_CACHE: 1
      UV_SYSTEM_PYTHON: 1

    steps:
      # 1. git clone code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      # 2. set up python
      - name: Install lsb-release
        run: |
          apt-get update
          apt-get install -y lsb-release

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # 3. install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade uv datasets
          uv pip install -r requirements-test.txt

          git clone --branch v4.1.0 https://github.com/princeton-nlp/SWE-bench.git
          cd SWE-bench
          pip install -e .

      # 4. Test with pytest
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov pytest-custom_exit_code
          export PYTHONPATH="${PYTHONPATH}:${GITHUB_WORKSPACE}"
          pytest tests/uni_agent/ -m="npu and level0" --suppress-no-test-exit-code --cov=./uni_agent/ --cov-report=xml --cov-report=term

      - name: Set CodeCov Environment
        run: apt-get install -y gnupg

      - name: Upload NPU coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: npu-tests

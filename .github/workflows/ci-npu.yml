name: tests-npu
on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  #  detect changes file
  changes:
    uses: ./.github/workflows/detect-changes.yml

  # ============ Job: test in npu ============
  run:
    needs: changes
    if: needs.changes.outputs.npu == 'true'
    runs-on: linux-aarch64-a2-8
    container:
      image: ascendai/cann:9.2.1-910b-ubuntu22.04-py3.11

    strategy:
      # 3.11, not 3.12: vllm-ascend's triton-ascend dependency has no cp312 wheels.
      matrix:
        python-version: [ "3.11" ]

    env:
      # use GitHub proxy to download
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # set pypi source
      UV_INDEX_URL: http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
      UV_EXTRA_INDEX_URL: "https://mirrors.huaweicloud.com/ascend/repos/pypi https://mirrors.huaweicloud.com/ascend/repos/pypi/nightly https://pypi.tuna.tsinghua.edu.cn/simple"
      UV_INDEX_STRATEGY: unsafe-best-match
      UV_NO_CACHE: 1
      UV_SYSTEM_PYTHON: 1

    steps:
      # 1. git clone code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      # 2. set up python
      - name: Install lsb-release
        run: |
          apt-get update
          apt-get install -y lsb-release gcc

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # 3. install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade uv datasets
          uv pip install -r requirements-test.txt
          uv pip install -r requirements-test-npu.txt --override requirements-test-npu-overrides.txt

          git clone --branch v4.1.0 https://github.com/princeton-nlp/SWE-bench.git
          cd SWE-bench
          pip install -e .

      # The CANN 9.2 gate image lacks rtFunctionGetMetaInfoSize and
      # MsprofUnRegisterCallback, which vllm-ascend's kernel library imports;
      # the stub lets it load (the rt symbol is only used by the MLA path,
      # which these Qwen3 models never reach).
      - name: Build CANN symbol shim
        run: |
          gcc -shared -fPIC -O2 -o /tmp/librt_metainfo_shim.so \
            tests/uni_agent/agent_aware_router/e2e/utils/rt_metainfo_shim.c

      # 4. Test with pytest
      - name: NPU env sanity
        env:
          LD_PRELOAD: /tmp/librt_metainfo_shim.so
        run: |
          ls /dev/davinci* 2>/dev/null || echo "NO davinci devices visible"
          python -c "import torch, torch_npu; print('npu device_count:', torch.npu.device_count())" || true
          ASCEND_RT_VISIBLE_DEVICES=0 VLLM_MODEL=/root/.cache/huggingface/hub/models--Qwen--Qwen3-0.6B/snapshots/c1899de289a04d12100db370d81485cdf75e47ca python - <<'EOF' || echo "SMOKE FAILED"
          import os
          from vllm import LLM
          llm = LLM(model=os.environ["VLLM_MODEL"], max_model_len=512, enforce_eager=True)
          out = llm.generate(["Hello"])
          print("SMOKE OK:", out[0].outputs[0].text[:20])
          EOF

      - name: Test with pytest
        env:
          LD_PRELOAD: /tmp/librt_metainfo_shim.so
        run: |
          uv pip install pytest pytest-cov pytest-custom_exit_code
          export PYTHONPATH="${PYTHONPATH}:${GITHUB_WORKSPACE}"
          pytest tests/uni_agent/ -m="npu and level0" --suppress-no-test-exit-code --cov=./uni_agent/ --cov-report=xml --cov-report=term

      # Upload coverage file to artifact
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 1

  npu-gate:
    runs-on: ubuntu-latest
    needs: [changes, run]
    if: always()
    steps:
      - name: Report result
        run: |
          if [[ "${{ needs.run.result }}" == "failure" ]]; then
            echo "NPU CI FAILED"
            exit 1
          fi
          echo "NPU CI SUCCESS"

  upload:
    # Call upload workflow, which is running in Ubuntu provided by GitHub
    needs: [ run, npu-gate ]
    uses: ./.github/workflows/upload_npu_assister.yml
    with:
      coverage-file: coverage.xml
      flags: npu-tests
      artifact-name: coverage-report
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

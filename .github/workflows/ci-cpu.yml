name: tests-cpu

on:
  pull_request:
    branches: [ "main" ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  #  detect changes file
  changes:
    uses: ./.github/workflows/detect-changes.yml

  # ============ Job: test in cpu ============
  run:
    needs: changes
    if: needs.changes.outputs.cpu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIP_NO_CACHE_DIR: "1"

    # tested in certain python version
    strategy:
      matrix:
        python-version: [ "3.12" ]

    steps:
      # 1. git clone code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space for vLLM dependencies
        run: |
          # These preinstalled SDKs are unused by the Python CPU tests.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # 2. set up python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          python -m pip install --no-deps -e .
          
          git clone --branch v4.1.0 https://github.com/princeton-nlp/SWE-bench.git
          cd SWE-bench
          pip install -e .

      # 4. Test with pytest
      - name: Test with pytest
        run: |
          pip install pytest pytest-cov pytest-custom_exit_code
          export PYTHONPATH="${PYTHONPATH}:${GITHUB_WORKSPACE}"
          pytest tests/uni_agent/ -m="cpu and level0" --suppress-no-test-exit-code --cov=./uni_agent/ --cov-report=xml --cov-report=term

      - name: Upload CPU coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: cpu-tests
          fail_ci_if_error: false

  cpu-gate:
    runs-on: ubuntu-latest
    needs: [ changes, run, test-vllm-native-contract ]
    if: always()
    steps:
      - name: Report result
        run: |
          if [[ "${{ needs.run.result }}" == "failure" ||
                "${{ needs.test-vllm-native-contract.result }}" == "failure" ||
                "${{ needs.test-vllm-native-contract.result }}" == "cancelled" ]]; then
            echo "CPU CI FAILED"
            exit 1
          fi
          echo "CPU CI SUCCESS"

  test-vllm-native-contract:
    name: vLLM native contract (0.29.0)
    needs: changes
    if: needs.changes.outputs.cpu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NATIVE_CONTRACT_VLLM_VERSION: "0.29.0"
      CUDA_VISIBLE_DEVICES: ""
      PIP_NO_CACHE_DIR: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free disk space for vLLM dependencies
        run: |
          # These preinstalled SDKs are unused by the Python CPU tests.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Select native contract dependencies
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          requirements = Path("requirements-test.txt").read_text().splitlines()
          assert requirements.count("vllm==0.23.0") == 1
          requirements[requirements.index("vllm==0.23.0")] = (
              f"vllm=={os.environ['NATIVE_CONTRACT_VLLM_VERSION']}"
          )
          Path("requirements-vllm-native.txt").write_text("\n".join(requirements) + "\n")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-vllm-native.txt pytest
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Verify installed vLLM
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          import vllm

          expected = os.environ["NATIVE_CONTRACT_VLLM_VERSION"]
          installed = version("vllm")
          assert installed == vllm.__version__ == expected, (installed, vllm.__version__, expected)
          print(f"vLLM {installed}: {vllm.__file__}")
          PY

      - name: Test native vLLM contract
        run: |
          python -m pytest -q --tb=short \
            --junitxml=native-vllm-contract.xml \
            tests/uni_agent/agent_aware_router/collectors/test_vllm_native_contract.py
          python - <<'PY'
          import xml.etree.ElementTree as ET

          cases = ET.parse("native-vllm-contract.xml").findall(".//testcase")
          assert cases, "No native contract tests ran"
          assert all(case.find("skipped") is None for case in cases), "Native contract tests were skipped"
          PY

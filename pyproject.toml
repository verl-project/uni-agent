# -------------------------------
# build-system
# -------------------------------
[build-system]
requires = [
    "setuptools>=77.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

# -------------------------------
# project (PEP 621 metadata)
# -------------------------------
[project]
name = "uni-agent"
dynamic = ["version"]

description = "Uni-Agent: Train Long-Horizon Agents at Scale"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"

# Framework/gateway runtime; training dependencies stay owned by ./verl.
dependencies = [
    "verl", "aiohttp", "cachetools", "fastapi", "httpx", "hydra-core",
    "numpy", "openai", "pillow", "pydantic>=2", "pyyaml", "pyzmq",
    "requests", "uvicorn", "xxhash",
    # The framework/TQ path stores NonTensorData (verl requires TensorDict >=0.10).
    "tensordict>=0.10.0",
]

[project.optional-dependencies]
modal = ["modal"]
e2b = ["e2b"]
vefaas = ["volcengine-python-sdk", "swe-rex"]
swebench = ["swebench==4.1.0"]
insight = ["rl-insight"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "pre-commit"]

[project.urls]
Documentation = "https://uni-agent.readthedocs.io/"
Repository = "https://github.com/verl-project/uni-agent"
Issues = "https://github.com/verl-project/uni-agent/issues"

# -------------------------------
# tool.ruff - Linting configuration
# -------------------------------
[tool.ruff]
line-length = 120
exclude = ["verl"]

[tool.ruff.lint]
isort = {known-first-party = ["verl"]}
# c.f. https://github.com/vllm-project/vllm/blob/ce8d6b75fc0586045df75ee1568a5b5f9957251b/pyproject.toml
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # isort
    "I",
    "G",
]
ignore = [
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
    # `.log()` statement uses f-string
    "G004",
    # X | None for type annotations
    "UP045",
    # deprecated import
    "UP035",
]

# -------------------------------
# tool.mypy - typechecking config
# -------------------------------
[tool.mypy]
pretty            = true
ignore_missing_imports = true
explicit_package_bases = true
follow_imports = "skip"
exclude = '(^|/)(verl)(/|$)'

# Blanket silence
ignore_errors = true

[[tool.mypy.overrides]]
module = [
"verl.trainer.config.algorithm",
"verl.trainer.ppo.core_algos",
"verl.trainer.ppo.reward",
"verl.workers.reward_manager",
"verl.workers.reward_manager.*",
]
ignore_errors = false

# -------------------------------
# tool.setuptools - Additional config
# -------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "uni_agent/version/version"}

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["uni_agent*"]

[tool.setuptools.package-data]
uni_agent = ["version/*"]
"uni_agent.agent_aware_router" = [
  "configs/*.yaml",
]

[tool.pytest.ini_options]
markers = [
    "cpu: run on cpu backend",
    "gpu: run on gpu backend",
    "npu: run on npu backend",
    "level0: mark level0 case, always run in CI",
    "level1: mark level1 case, full test, not included in CI"
]

# BEGIN GENERATED VERL UV POLICY
[tool.uv]
"environments" = [
    "python_full_version >= '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "python_full_version >= '3.12' and sys_platform == 'linux' and platform_machine == 'aarch64'",
]
"override-dependencies" = [
    "transformers==5.12.1",
    "numpy>=2.0.0",
    "kernels>=0.14.1,<0.15",
    "flash-attn-4 ; platform_machine == 'flash-attn-4-excluded'",
    "nvidia-cusparselt-cu13==0.8.0 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "nvidia-cusparselt-cu13==0.9.1 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
]

[[tool.uv."dependency-metadata"]]
"name" = "megatron-core"
"version" = "0.19.2"
"requires-dist" = [
    "torch>=2.6.0",
    "numpy",
    "packaging>=24.2",
]

[[tool.uv."dependency-metadata"]]
"name" = "megatron-bridge"
"version" = "0.6.2"
"requires-dist" = []

[[tool.uv."dependency-metadata"]]
"name" = "veomni"
"version" = "0.1.12"
"requires-dist" = []

[[tool.uv."dependency-metadata"]]
"name" = "torchtitan"
"version" = "0.3.0"
"requires-dist" = []

[[tool.uv."dependency-metadata"]]
"name" = "TransferQueue"
"requires-dist" = []

[[tool.uv."index"]]
"name" = "pytorch-cu130"
"url" = "https://download.pytorch.org/whl/cu130"
"explicit" = true

[[tool.uv."index"]]
"name" = "pytorch-cpu"
"url" = "https://download.pytorch.org/whl/cpu"
"explicit" = true

[[tool.uv."index"]]
"name" = "verl-wheelhouse"
"url" = "https://verl-project.github.io/verl-wheelhouse/cu130/torch2.13/simple/"
"explicit" = true

[tool.uv.workspace]
"members" = [
    "verl",
]

[tool.uv.sources]

[tool.uv.sources."verl"]
"workspace" = true

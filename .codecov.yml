# Codecov configuration:
# - CPU/GPU coverage reports are uploaded with separate flags
# - Codecov auto-merges them per commit/PR and reports back via status checks
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

flags:
  cpu-tests:
    carryforward: true
  gpu-tests:
    carryforward: true
  npu-tests-card1:
    carryforward: true
  npu-tests-card2:
    carryforward: true
  npu-tests-card4:
    carryforward: true
  npu-tests-card8:
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
